<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HealthyWork</title>
    <meta
      name="description"
      content="Water, movement breaks and focus blocks for people who work at a computer. Free, open source, and your data never leaves your device."
    />
    <meta name="theme-color" content="#F2F5F3" />
    <!-- .ico for browsers and shortcuts that only take that; the SVG wins wherever it is supported. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <script>
      // Resolve the theme before first paint so there is no light/dark flash.
      // "hw-theme" mirrors the appearance setting stored in IndexedDB.
      (function () {
        var theme = 'light';
        try {
          var pref = localStorage.getItem('hw-theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (pref === 'dark' || (pref !== 'light' && systemDark)) theme = 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
