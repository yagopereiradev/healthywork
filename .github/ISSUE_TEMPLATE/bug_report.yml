name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: I logged 250 ml of water and the bar did not move.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      description: The shorter the better. If it also happens with sample data (add ?demo=1 to the address), say so.
      placeholder: |
        1. Open Today
        2. Tap "+ 250 ml of water"
        3. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and system
      placeholder: Chrome 131 on Windows 11, installed as an app
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language of the app
      options:
        - Português
        - Español
        - English
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: A screenshot or a short recording helps a lot. Please do not paste your exported data file here.
